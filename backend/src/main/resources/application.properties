# Server Configuration
server.port=${PORT:8081}

# Spring Boot & Database Connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pool Settings (Capped at 5 for Supabase Free Tier)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# Flyway Migration Settings (Reuses primary DataSource connections to inherit pooler configurations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=3
spring.flyway.baseline-on-migrate=true

# Security & JWT Configuration
jwt.secret=${JWT_SECRET}
# 7 days in milliseconds = 7 * 24 * 60 * 60 * 1000 = 604800000
jwt.expiration=604800000

# CORS Origins
allowed.origins=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# API Keys
youtube.api.key=${YOUTUBE_API_KEY:}
reddit.user-agent=${REDDIT_USER_AGENT:SignalFeed/1.0 (content aggregator)}

# Actuator Endpoints Config
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
